name: Plugin ZIP

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build cec-remote.zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install & build
        run: |
          pnpm i --frozen-lockfile
          pnpm build

      - name: Package ZIP
        run: ./scripts/package-zip.sh "$GITHUB_WORKSPACE/cec-remote.zip"

      # archive: false = upload the Decky zip as-is (no zip-in-zip).
      # Hidden paths like .pack are skipped by default; do not use those.
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: cec-remote.zip
          archive: false
          if-no-files-found: error

      - name: Attach to GitHub Release (published release or version tag)
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: cec-remote.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
